# config/services.yaml
# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    resources_directory: '%kernel.project_dir%/public/uploads/resources'
    avatars_directory: '%kernel.project_dir%/public/uploads/avatars'
    groq_api_key: '%env(GROQ_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $resourcesDirectory: '%resources_directory%'
            string $groqApiKey: '%env(GROQ_API_KEY)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Controller\AdminController:
        arguments:
             $groqApiKey: '%env(GROQ_API_KEY)%'
    # Explicit service configurations

    App\Service\FriendService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\WorkspaceSocialService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AvatarService:
        arguments:
            $uploadDir: '%avatars_directory%'

    App\Service\Guardian\GuardianAiAssistant:
        arguments:
            $provider: '%env(string:GUARDIAN_AI_PROVIDER)%'
            $openAiApiKey: '%env(string:OPENAI_API_KEY)%'
            $openAiModel: '%env(string:GUARDIAN_OPENAI_MODEL)%'
            $geminiApiKey: '%env(string:GEMINI_API_KEY)%'
            $geminiModel: '%env(string:GUARDIAN_GEMINI_MODEL)%'
            $claudeApiKey: '%env(string:CLAUDE_API_KEY)%'
            $claudeModel: '%env(string:GUARDIAN_CLAUDE_MODEL)%'
